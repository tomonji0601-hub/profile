<h2>降雨による土壌侵食と写真測量</h2>
<p>室内の降雨実験と屋外圃場での実験を行い、SfM写真測量で求めた地表面の変化から、侵食量を推定する方法を検討しています。</p>
<p>写真から作成した三次元モデルを用いて侵食箇所や地形の変化を捉え、実測した土砂流出量との比較から、推定精度を評価します。</p>
<p class="muted">研究キーワード：土壌侵食、降雨実験、SfM写真測量</p>
