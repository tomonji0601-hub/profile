title: "IWATA TOMOKI"
description: "研究・調査活動についての記録"
lang: ja
timezone: Asia/Tokyo
url: "https://tomonji0601-hub.github.io"
baseurl: "/profile"
markdown: kramdown
permalink: /notes/:year/:month/:day/:title/
exclude: [README.md, Gemfile, Gemfile.lock, vendor, preview.html, preview-research.html, preview-notes.html]
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post

