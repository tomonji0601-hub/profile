<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head>
<body><a class="skip" href="#main">本文へ移動</a><header class="header"><div class="header-inner"><a class="brand" href="{{ '/' | relative_url }}"><span class="affiliation">Protecting Lives from Natural Disasters</span><span class="site-name">IWATA TOMOKI</span></a><nav aria-label="メイン"><a href="{{ '/' | relative_url }}"{% if page.nav == 'home' %} aria-current="page"{% endif %}>Home</a><a href="{{ '/research/' | relative_url }}"{% if page.nav == 'research' %} aria-current="page"{% endif %}>Research</a><a href="{{ '/notes/' | relative_url }}"{% if page.nav == 'notes' or page.layout == 'post' %} aria-current="page"{% endif %}>Notes</a></nav></div></header>
{% if page.home and site.cover_image != "" and site.cover_image %}<figure class="research-cover"><img src="{{ site.cover_image | relative_url }}" alt="{{ site.cover_alt | escape }}">{% if site.cover_caption and site.cover_caption != "" %}<figcaption>{{ site.cover_caption | escape }}</figcaption>{% endif %}</figure>{% endif %}<main id="main">{{ content }}</main><footer>Iwata Tomoki since 2026 <a href="https://researchmap.jp/tiwata0601">researchmap</a></footer></body></html>
